# Generated by Nuitka Studio. Builds run natively on each target OS.
name: Nuitka Studio Cross Build

on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: nuitka-cross-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native build
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        shell: bash
        env:
          REQUIREMENTS_FILE: "requirements.txt"
        run: |
          python -m pip install --upgrade pip
          if [ -n "$REQUIREMENTS_FILE" ] && [ -f "$REQUIREMENTS_FILE" ]; then
            python -m pip install -r "$REQUIREMENTS_FILE"
          fi
          python -m pip install --upgrade nuitka ordered-set zstandard

      - name: Build with Nuitka
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, shlex, subprocess, sys
          args = json.loads(base64.b64decode("").decode("utf-8"))
          command = [sys.executable, "-m", "nuitka", *args]
          print("Running:", shlex.join(command))
          subprocess.run(command, check=True)
          PY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuitkaStudio-3.9.1-windows
          path: |
            build/*.exe
            build/*.dist/**
          if-no-files-found: error
          retention-days: 14
  linux:
    name: Linux native build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf

      - name: Install project dependencies
        shell: bash
        env:
          REQUIREMENTS_FILE: "requirements.txt"
        run: |
          python -m pip install --upgrade pip
          if [ -n "$REQUIREMENTS_FILE" ] && [ -f "$REQUIREMENTS_FILE" ]; then
            python -m pip install -r "$REQUIREMENTS_FILE"
          fi
          python -m pip install --upgrade nuitka ordered-set zstandard

      - name: Build with Nuitka
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, shlex, subprocess, sys
          args = json.loads(base64.b64decode("WyItLW1vZGU9b25lZmlsZSIsIi0tYXNzdW1lLXllcy1mb3ItZG93bmxvYWRzIiwiLS1yZW1vdmUtb3V0cHV0IiwiLS1qb2JzPS0yIiwiLS1vbmVmaWxlLW5vLWNvbXByZXNzaW9uIiwiLS1lbmFibGUtcGx1Z2luPXRrLWludGVyIiwiLS1vdXRwdXQtZGlyPWJ1aWxkIiwiLS1vdXRwdXQtZmlsZW5hbWU9TnVpdGthU3R1ZGlvLTMuOSIsIm51aXRrYV9idWlsZGVyX3dvcmsvcnVuLnB5Il0=").decode("utf-8"))
          command = [sys.executable, "-m", "nuitka", *args]
          print("Running:", shlex.join(command))
          subprocess.run(command, check=True)
          PY

      - name: Package Linux build
        shell: bash
        run: |
          mkdir -p release
          tar --exclude='*.build' --exclude='*.onefile-build' -czf "release/NuitkaStudio-3.9.1-linux.tar.gz" -C build .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuitkaStudio-3.9.1-linux
          path: release/NuitkaStudio-3.9.1-linux.tar.gz
          if-no-files-found: error
          retention-days: 14
